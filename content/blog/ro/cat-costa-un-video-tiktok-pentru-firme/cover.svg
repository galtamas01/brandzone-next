<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
        .cover-line { fill: none; stroke: rgba(255, 255, 255, 0.5); stroke-width: 1.2; }
        .cover-bar { fill: rgba(255, 255, 255, 0.85); }
        .cover-bar.b1 { animation: barGrow1 6s ease-in-out infinite; }
        .cover-bar.b2 { animation: barGrow2 6s ease-in-out infinite 0.3s; }
        .cover-bar.b3 { animation: barGrow3 6s ease-in-out infinite 0.6s; }

        @keyframes barGrow1 {
            0%, 100% { width: 60px; }
            50% { width: 92px; }
        }

        @keyframes barGrow2 {
            0%, 100% { width: 130px; }
            50% { width: 176px; }
        }

        @keyframes barGrow3 {
            0%, 100% { width: 210px; }
            50% { width: 248px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cover-bar.b1, .cover-bar.b2, .cover-bar.b3 { animation: none; }
        }
    </style>

    <path class="cover-line" d="M60,40 V186"/>
    <rect class="cover-bar b1" x="60" y="62" width="60" height="14" rx="7"/>
    <rect class="cover-bar b2" x="60" y="105" width="130" height="14" rx="7"/>
    <rect class="cover-bar b3" x="60" y="148" width="210" height="14" rx="7"/>
</svg>
