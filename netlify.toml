# Netlify build beállítások. A Netlify UI-ban semmit nem kell külön megadni.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Gyorsítótár: a /_next/static alatti fájlok neve tartalom-hash-t kap, örökre cache-elhetők.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# A régi oldal .html-es linkjei (hu.html, policy/….html, form-submit/….html)
# átirányítás nélkül is működnek, mert a statikus export pont ezeket a fájlokat
# hozza létre; a canonical tagek mondják meg a Google-nek, melyik a fő URL.
